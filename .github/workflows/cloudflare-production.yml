name: Cloudflare production deployment

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Exact SHA promoted to the production branch"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cloudflare-production-${{ github.repository }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref_name == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact production SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}

      - name: Verify production branch and exact SHA
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] ||
             [[ "$SOURCE_SHA" != "$GITHUB_SHA" ]] ||
             [[ "$(git rev-parse HEAD)" != "$SOURCE_SHA" ]]; then
            echo "::error::The requested SHA must exactly match the production branch event and checkout."
            exit 1
          fi

      - name: Verify Cloudflare credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Configure CLOUDFLARE_API_TOKEN (Actions secret) and CLOUDFLARE_ACCOUNT_ID (Actions variable) for this repository."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build production assets
        run: npm run build

      - name: Deploy production Worker
        run: npx --yes wrangler@4.147.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify production hostname
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error https://advisor-showcase.anclora.com/ -o /dev/null; then
              echo "Cloudflare production hostname returned HTTP 200."
              exit 0
            fi
            echo "Waiting for Cloudflare custom-domain activation ($attempt/30)..."
            sleep 10
          done
          echo "::error::Production hostname did not become healthy within five minutes."
          exit 1
