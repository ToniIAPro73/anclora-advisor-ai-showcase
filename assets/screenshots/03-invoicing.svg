    <text x="1008" y="406" font-weight="600">847,00 €</text>

    <!-- row 3 -->
    <line x1="248" y1="484" x2="1232" y2="484" stroke="#EEF2F2" stroke-width="1"/>
    <text x="272" y="466" font-weight="600" fill="#0F7A62">F-2026-003</text>
    <text x="412" y="466">Clínica Norte</text>
    <text x="700" y="466">22/08/2026</text>
    <rect x="836" y="448" width="76" height="24" rx="12" fill="#1DAB89" fill-opacity="0.14"/>
    <text x="874" y="464" text-anchor="middle" font-size="11" font-weight="600" fill="#0F7A62">Pagada</text>
    <text x="1008" y="466" font-weight="600">2.450,00 €</text>

    <!-- row 4 -->
    <line x1="248" y1="544" x2="1232" y2="544" stroke="#EEF2F2" stroke-width="1"/>
    <text x="272" y="526" font-weight="600" fill="#0F7A62">F-2026-004</text>
    <text x="412" y="526">Papelería Cordal</text>
    <text x="700" y="526">25/08/2026</text>
    <rect x="836" y="508" width="96" height="24" rx="12" fill="#C05A5A" fill-opacity="0.14"/>
    <text x="884" y="524" text-anchor="middle" font-size="11" font-weight="600" fill="#8F3A3A">Rectificada</text>
    <text x="1008" y="526" font-weight="600">303,00 €</text>

    <!-- row 5 -->
    <text x="272" y="586" font-weight="600" fill="#0F7A62">F-2026-005</text>
    <text x="412" y="586">Talleres Miramar S.L.</text>
    <text x="700" y="586">28/08/2026</text>
    <rect x="836" y="568" width="86" height="24" rx="12" fill="#D9A441" fill-opacity="0.16"/>
    <text x="879" y="584" text-anchor="middle" font-size="11" font-weight="600" fill="#8F6A1E">Pendiente</text>
    <text x="1008" y="586" font-weight="600">660,00 €</text>
