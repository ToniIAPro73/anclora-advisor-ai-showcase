  <text x="272" y="158" font-size="28" font-weight="700" fill="#1F2A2E">4.820,00 €</text>

  <rect x="584" y="84" width="4" height="108" fill="#D9A441"/>
  <text x="608" y="116" font-size="12" font-weight="600" fill="#6B807D">PENDIENTE DE COBRO</text>
