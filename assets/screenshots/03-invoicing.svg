  <!-- table footer -->
  <text x="272" y="664" font-size="11" fill="#8CA3A0">Mostrando 5 de 12 facturas · agosto de 2026</text>

  <!-- synthetic caption -->
  <text x="1264" y="786" text-anchor="end" font-size="10" fill="#8CA3A0">Datos sintéticos — mockup de demostración</text>
</svg>
