<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F1720"/>
      <stop offset="1" stop-color="#1A2630"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1DAB89"/>
      <stop offset="1" stop-color="#17C69C"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1280" height="800" fill="url(#bgGrad)"/>

  <!-- subtle decorative rings -->
  <circle cx="1120" cy="140" r="180" fill="none" stroke="#1DAB89" stroke-opacity="0.12" stroke-width="2"/>
  <circle cx="1120" cy="140" r="120" fill="none" stroke="#1DAB89" stroke-opacity="0.18" stroke-width="2"/>
  <circle cx="160" cy="680" r="140" fill="none" stroke="#1DAB89" stroke-opacity="0.10" stroke-width="2"/>

  <!-- login card -->
  <g filter="url(#cardShadow)">
    <rect x="430" y="170" width="420" height="460" rx="16" fill="#1E2933" stroke="#2C3A46" stroke-width="1"/>
  </g>
  <rect x="430" y="170" width="420" height="6" rx="3" fill="url(#accentGrad)"/>

  <!-- wordmark -->
  <text x="640" y="248" text-anchor="middle" font-size="28" font-weight="700" fill="#F1F5F4">Anclora <tspan fill="#1DAB89">Advisor AI</tspan></text>
  <text x="640" y="278" text-anchor="middle" font-size="13" fill="#8CA3A0">Inteligencia documental y soporte a decisiones</text>

  <!-- email field -->
  <text x="478" y="332" font-size="12" font-weight="600" fill="#AEC3BF">Correo electrónico</text>
  <rect x="478" y="342" width="324" height="44" rx="8" fill="#161F27" stroke="#33434F" stroke-width="1"/>
  <text x="494" y="369" font-size="14" fill="#5E7370">tu@email.com</text>

  <!-- password field -->
  <text x="478" y="424" font-size="12" font-weight="600" fill="#AEC3BF">Contraseña</text>
  <rect x="478" y="434" width="324" height="44" rx="8" fill="#161F27" stroke="#33434F" stroke-width="1"/>
  <text x="494" y="461" font-size="14" fill="#5E7370">••••••••</text>

  <!-- primary button -->
  <rect x="478" y="506" width="324" height="46" rx="8" fill="#1DAB89"/>
  <text x="640" y="535" text-anchor="middle" font-size="15" font-weight="600" fill="#06231C">Iniciar sesión</text>

  <!-- footer -->
  <text x="640" y="592" text-anchor="middle" font-size="11" fill="#6B807D">Acceso seguro · Sesión protegida</text>

  <!-- synthetic caption -->
  <text x="1264" y="786" text-anchor="end" font-size="10" fill="#5E7370">Datos sintéticos — mockup de demostración</text>
</svg>
