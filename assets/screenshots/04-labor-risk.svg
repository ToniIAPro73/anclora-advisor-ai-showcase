<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" font-family="Inter, system-ui, sans-serif">
  <defs>
    <filter id="panelShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#0B1220" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1280" height="800" fill="#F4F6F7"/>

  <!-- sidebar -->
  <rect x="0" y="0" width="220" height="800" fill="#14201D"/>
  <text x="24" y="44" font-size="17" font-weight="700" fill="#F1F5F4">Anclora <tspan fill="#1DAB89">Advisor AI</tspan></text>
  <g font-size="13" fill="#9FB5B0">
    <text x="36" y="100">Chat</text>
    <text x="36" y="140">Fiscal</text>
    <rect x="12" y="156" width="196" height="38" rx="8" fill="#1DAB89" fill-opacity="0.16"/>
    <rect x="12" y="160" width="3" height="30" rx="1.5" fill="#1DAB89"/>
    <text x="36" y="180" fill="#E8F5F1" font-weight="600">Laboral</text>
    <text x="36" y="220">Facturación</text>
    <text x="36" y="260">Alertas</text>
  </g>
  <text x="24" y="770" font-size="10" fill="#5E7370">v1.2 · entorno de demostración</text>

  <!-- header -->
  <rect x="220" y="0" width="1060" height="60" fill="#FFFFFF" stroke="#E2E8E8" stroke-width="1"/>
  <text x="248" y="37" font-size="15" font-weight="600" fill="#1F2A2E">Riesgo laboral</text>
  <circle cx="1208" cy="30" r="16" fill="#1DAB89" fill-opacity="0.18"/>
  <text x="1208" y="35" text-anchor="middle" font-size="12" font-weight="700" fill="#0F7A62">DU</text>
  <text x="1184" y="35" text-anchor="end" font-size="12" fill="#4A5A5E">Demo Usuario</text>

  <!-- context line -->
  <text x="248" y="100" font-size="12" fill="#6B807D">Contexto: Transición a pluriactividad — caso de demostración</text>

  <!-- risk summary card -->
  <g filter="url(#panelShadow)">
    <rect x="248" y="116" width="480" height="180" rx="12" fill="#FFFFFF" stroke="#E2E8E8" stroke-width="1"/>
  </g>
  <text x="272" y="150" font-size="13" font-weight="600" fill="#6B807D">NIVEL DE RIESGO</text>
  <text x="272" y="188" font-size="26" font-weight="700" fill="#8F6A1E">Moderado</text>
  <!-- gauge bar -->
  <rect x="272" y="208" width="420" height="12" rx="6" fill="#EDF1F1"/>
  <rect x="272" y="208" width="210" height="12" rx="6" fill="#D9A441"/>
  <circle cx="482" cy="214" r="10" fill="#FFFFFF" stroke="#D9A441" stroke-width="3"/>
  <g font-size="11" fill="#9FB5B0">
    <text x="272" y="244">Bajo</text>
    <text x="466" y="244" text-anchor="middle" fill="#8F6A1E" font-weight="600">Moderado</text>
    <text x="692" y="244" text-anchor="end">Alto</text>
  </g>
  <text x="272" y="276" font-size="11" fill="#6B807D">Última evaluación: 26/08/2026 · 4 señales activas</text>

  <!-- alerts panel -->
  <g filter="url(#panelShadow)">
    <rect x="752" y="116" width="480" height="180" rx="12" fill="#FFFFFF" stroke="#E2E8E8" stroke-width="1"/>
  </g>
  <rect x="752" y="116" width="4" height="180" fill="#1DAB89"/>
  <text x="776" y="150" font-size="13" font-weight="600" fill="#6B807D">ALERTAS</text>
  <text x="776" y="184" font-size="20" font-weight="700" fill="#1F2A2E">2 recordatorios próximos</text>
  <circle cx="784" cy="214" r="3" fill="#1DAB89"/>
  <text x="798" y="218" font-size="12" fill="#33434A">Revisar compatibilidad de cotizaciones — 02/09/2026</text>
  <circle cx="784" cy="240" r="3" fill="#1DAB89"/>
  <text x="798" y="244" font-size="12" fill="#33434A">Actualizar contrato a tiempo parcial — 09/09/2026</text>
  <text x="776" y="278" font-size="11" font-weight="600" fill="#0F7A62">Ver todos los recordatorios →</text>

  <!-- mitigation actions table -->
  <g filter="url(#panelShadow)">
    <rect x="248" y="320" width="984" height="364" rx="12" fill="#FFFFFF" stroke="#E2E8E8" stroke-width="1"/>
  </g>
  <text x="272" y="356" font-size="14" font-weight="600" fill="#1F2A2E">Acciones de mitigación</text>

  <rect x="248" y="376" width="984" height="40" fill="#F4F6F7"/>
  <g font-size="11" font-weight="700" fill="#6B807D">
    <text x="272" y="401">ACCIÓN</text>
    <text x="840" y="401">ESTADO</text>
    <text x="1010" y="401">EVIDENCIAS</text>
  </g>

  <g font-size="13" fill="#33434A">
    <!-- action 1 -->
    <line x1="248" y1="492" x2="1232" y2="492" stroke="#EEF2F2" stroke-width="1"/>
    <text x="272" y="440" font-weight="600" fill="#1F2A2E">Documentar base de cotización en ambos regímenes</text>
    <text x="272" y="462" font-size="11" fill="#8CA3A0">Conservar justificantes de alta y recibos de autónomos del trimestre.</text>
    <rect x="840" y="436" width="82" height="24" rx="12" fill="#4A6FA5" fill-opacity="0.14"/>
    <text x="881" y="452" text-anchor="middle" font-size="11" font-weight="600" fill="#2F4E7C">En curso</text>
    <text x="1010" y="452" fill="#0F7A62" font-weight="600">2 documentos</text>

    <!-- action 2 -->
    <line x1="248" y1="568" x2="1232" y2="568" stroke="#EEF2F2" stroke-width="1"/>
    <text x="272" y="516" font-weight="600" fill="#1F2A2E">Revisar cláusula de exclusividad del contrato</text>
    <text x="272" y="538" font-size="11" fill="#8CA3A0">Confirmar que la actividad por cuenta propia no entra en conflicto.</text>
    <rect x="840" y="512" width="86" height="24" rx="12" fill="#D9A441" fill-opacity="0.16"/>
    <text x="883" y="528" text-anchor="middle" font-size="11" font-weight="600" fill="#8F6A1E">Pendiente</text>
    <text x="1010" y="528" fill="#8CA3A0">—</text>

    <!-- action 3 -->
    <text x="272" y="592" font-weight="600" fill="#1F2A2E">Notificar inicio de pluriactividad a la gestoría</text>
    <text x="272" y="614" font-size="11" fill="#8CA3A0">Comunicación enviada y acuse recibido el 20/08/2026.</text>
    <rect x="840" y="588" width="92" height="24" rx="12" fill="#1DAB89" fill-opacity="0.14"/>
    <text x="886" y="604" text-anchor="middle" font-size="11" font-weight="600" fill="#0F7A62">Completada</text>
    <text x="1010" y="604" fill="#0F7A62" font-weight="600">1 documento</text>
  </g>

  <text x="272" y="664" font-size="11" fill="#8CA3A0">Las acciones se generan a partir del análisis documental del caso.</text>

  <!-- synthetic caption -->
  <text x="1264" y="786" text-anchor="end" font-size="10" fill="#8CA3A0">Datos sintéticos — mockup de demostración</text>
</svg>
